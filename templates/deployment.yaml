{{- range $.Values.pgConnections }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dirt-tile-server.fullname"  $ }}-{{ .secretName }}
  labels:
    {{- include "dirt-tile-server.labels" $ | nindent 4 }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ $.Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dirt-tile-server.selectorLabels"  $ | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if $.Values.recreatePods }}
        rollme: {{ randAlphaNum 5 | quote }}
        {{- end }}
        {{- if $.Values.sidecar.enabled }}
        checksum/sidecar-config: {{ include (print $.Template.BasePath "/sidecar-configmap.yaml") $ | sha256sum }}
        {{- end }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dirt-tile-server.selectorLabels"  $ | nindent 8 }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dirt-tile-server.serviceAccountName"  $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $.Chart.Name }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          env:
            - name: POSTGRES_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: pgconnection
                  optional: false
            - name: POSTGRES_STATEMENT_TIMEOUT
              value: {{ $.Values.configs.statementtimeout | quote }}
            - name: TABLE_COLUMN
              value: {{ $.Values.configs.tablecolumn }}
            - name: TABLE_NAME
              value: {{ $.Values.configs.tablename }}
            - name: SERVER_LOGGER
              value: {{ $.Values.configs.serverlogger | quote }}
            - name: SERVER_PORT
              value: {{ $.Values.configs.serverport | quote }}
            - name: ONADATA_URL
              value: {{ $.Values.configs.onadataurl }}
            - name: FORMS_ENDPOINT
              value: {{ $.Values.configs.formsendpoint }}
            - name: DATAVIEWS_ENDPOINT
              value: {{ $.Values.configs.dataviewsendpoint }}
            - name: MERGED_DATASETS_ENDPOINT
              value: {{ $.Values.configs.mergeddatasetsendpoint }}
            - name: CORS_ORIGINS
              value: {{ $.Values.configs.corsorigins | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: [ "npm", "start" ]
          ports:
            - name: http
              containerPort: {{ $.Values.containerPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml $.Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $.Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
        {{- if $.Values.sidecar.enabled }}
        - name: sidecar
          securityContext:
            {{- toYaml $.Values.sidecar.securityContext | nindent 12 }}
          image: "{{ $.Values.sidecar.image.repository }}:{{ $.Values.sidecar.image.tag }}"
          imagePullPolicy: {{ $.Values.sidecar.image.pullPolicy }}
          ports:
            - name: sidecar-http
              containerPort: {{ $.Values.sidecar.port }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: sidecar-http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health-check
              port: sidecar-http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: {{ $.Values.readinessProbe.timeoutSeconds }}
          resources:
            {{- toYaml $.Values.sidecar.resources | nindent 12 }}
          volumeMounts:
            - name: sidecar-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: sidecar-cache
              mountPath: /tmp
        {{- end }}
      {{- if $.Values.sidecar.enabled }}
      volumes:
        - name: sidecar-config
          configMap:
            name: {{ include "dirt-tile-server.fullname" $ }}-sidecar
        - name: sidecar-cache
          emptyDir:
            sizeLimit: {{ $.Values.sidecar.responseCache.volumeSize }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
