{{- if .Values.sidecar.enabled }}
{{- $onadataUrl := .Values.sidecar.onadataUrl | default .Values.configs.onadataurl }}
{{- if not $onadataUrl }}
{{- fail "sidecar.enabled=true requires sidecar.onadataUrl or configs.onadataurl to be set" }}
{{- end }}
{{- if not (regexMatch "^https?://[A-Za-z0-9._-]+(:[0-9]+)?$" $onadataUrl) }}
{{- fail (printf "the address permission is asked at must be http:// or https:// followed by a host and nothing more, not %q" $onadataUrl) }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" (.Values.sidecar.resolver | toString)) }}
{{- fail (printf "sidecar.resolver must be an address or a name the cluster resolves in full, not %q" .Values.sidecar.resolver) }}
{{- end }}
{{- $origins := include "dirt-tile-server.allowedOrigins" . | fromJsonArray }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dirt-tile-server.fullname" . }}-sidecar
  labels:
    {{- include "dirt-tile-server.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections {{ .Values.sidecar.workerConnections }}; }
    http {
      # The token travels in the query string, so requests are logged by
      # path and dataset, never by their full URL.
      log_format dataset '$remote_addr [$time_local] "$request_method $uri" '
                         '$status $body_bytes_sent '
                         'form=$arg_form_id dataview=$arg_dataview_id '
                         'merged=$arg_merged_dataset_id '
                         'cache=$upstream_cache_status time=$request_time';
      access_log /dev/stdout dataset;

      proxy_temp_path /tmp/proxy;
      client_body_temp_path /tmp/client_body;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      proxy_cache_path /tmp/permission_cache keys_zone=permission_cache:10m max_size=64m inactive=10m use_temp_path=off;
      {{- if .Values.sidecar.responseCache.enabled }}
      proxy_cache_path /tmp/response_cache keys_zone=response_cache:{{ .Values.sidecar.responseCache.keysZoneMb }}m max_size={{ .Values.sidecar.responseCache.maxSize }} inactive={{ .Values.sidecar.responseCache.inactive }} use_temp_path=off;
      {{- end }}

      upstream tiles {
        server 127.0.0.1:{{ .Values.containerPort }};
        keepalive 16;
      }

      # proxy_pass with a variable resolves the hostname at request time,
      # which needs an explicit resolver.
      resolver {{ .Values.sidecar.resolver }} valid={{ .Values.sidecar.resolverValid }} ipv6=off;

      # A response is cached under the parameters named in its cache key. A
      # parameter this proxy cannot see by name, such as one whose name is
      # percent-encoded, would change the response without changing the key,
      # so a request carrying one is refused. So is one that gives a name
      # twice, of which this proxy reads the first value only.
      map $args $accepted_args {
        default 0;
        "~(?:^|&)([a-z_]+)=.*&\1=" 0;
        "~^(?:form_id|dataview_id|merged_dataset_id|temp_token|field_name|field_value|columns|id_column|limit|nocache)=[^&]*(?:&(?:form_id|dataview_id|merged_dataset_id|temp_token|field_name|field_value|columns|id_column|limit|nocache)=[^&]*)*$" 1;
      }

      # Exactly one dataset id, a positive integer without leading zeros, so
      # that nothing else can reach the path of the permission request.
      map "$arg_merged_dataset_id|$arg_dataview_id|$arg_form_id" $permission_url {
        default "";
        "~^(?<mid>[1-9][0-9]{0,9})\|\|$"  "{{ $onadataUrl }}{{ .Values.configs.mergeddatasetsendpoint }}$mid.json";
        "~^\|(?<did>[1-9][0-9]{0,9})\|$"  "{{ $onadataUrl }}{{ .Values.configs.dataviewsendpoint }}$did.json";
        "~^\|\|(?<fid>[1-9][0-9]{0,9})$"  "{{ $onadataUrl }}{{ .Values.configs.formsendpoint }}$fid.json";
      }

      map $arg_temp_token $permission_header {
        default "TempToken $arg_temp_token";
        ""      "";
      }

      # Set here and not by the upstream, whose headers would otherwise be
      # cached with the response and replayed to a caller of another origin.
      map $http_origin $cors_origin {
        {{- if has "*" $origins }}
        default "*";
        {{- else }}
        default "";
        {{- range $origins }}
        {{ . | quote }} $http_origin;
        {{- end }}
        {{- end }}
      }

      server {
        listen {{ .Values.sidecar.port }};
        server_tokens off;
        default_type application/json;

        # Both are needed for the upstream keepalive pool to be used.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        {{- include "dirt-tile-server.corsHeaders" . | nindent 8 }}

        # Answered before the permission request, which a preflight carries
        # nothing to pass.
        if ($request_method = OPTIONS) {
          return 204;
        }

        location = /health-check {
          access_log off;
          {{- include "dirt-tile-server.corsHeadersOfOurOwn" . | nindent 10 }}
          proxy_pass http://tiles;
        }

        # Asks whether the caller may read the dataset. The target and the
        # header are set by the location that calls this one, where the query
        # string is still available.
        location = /_permission {
          internal;
          proxy_method HEAD;
          proxy_pass_request_body off;
          # The caller's own headers are left behind: a cookie among them
          # could win an approval that is then kept under the token alone.
          proxy_pass_request_headers off;
          proxy_set_header Content-Length "";
          proxy_set_header Authorization $permission_header_sent;
          proxy_ssl_server_name on;
          proxy_ssl_name $permission_host;
          proxy_ssl_verify on;
          proxy_ssl_trusted_certificate {{ .Values.sidecar.trustedCertificates }};
          proxy_ssl_verify_depth 3;
          proxy_set_header Host $permission_host;
          proxy_connect_timeout {{ .Values.sidecar.permissionConnectTimeoutSeconds }}s;
          proxy_send_timeout {{ .Values.sidecar.permissionReadTimeoutSeconds }}s;
          proxy_read_timeout {{ .Values.sidecar.permissionReadTimeoutSeconds }}s;
          proxy_pass $permission_target;
          proxy_cache permission_cache;
          proxy_cache_key "$permission_target|$permission_header_sent";
          proxy_cache_valid 200 {{ .Values.sidecar.permissionTtlSeconds }}s;
          proxy_cache_valid 401 403 404 {{ .Values.sidecar.refusalTtlSeconds }}s;
          # How long an answer is kept is settled here, not by the service
          # that gives it.
          proxy_ignore_headers Cache-Control Expires X-Accel-Expires X-Accel-Redirect Set-Cookie Vary;
          # The tiles of one map view arrive together: the first asks, and
          # the rest wait for its answer.
          proxy_cache_lock on;
          # A dataset the caller may not read is reported upstream as missing,
          # which auth_request would otherwise turn into a 500.
          proxy_intercept_errors on;
          error_page 404 =403 @denied;
        }

        location @denied {
          internal;
          return 403;
        }

        location ~ "^/v1/mvt/(?:0|[1-9][0-9]?)/(?:0|[1-9][0-9]{0,9})/(?:0|[1-9][0-9]{0,9})$" {
          {{- include "dirt-tile-server.cachedLocation" . | nindent 10 }}
        }

        location = /v1/bounds {
          {{- include "dirt-tile-server.cachedLocation" . | nindent 10 }}
        }

        location / {
          return 404 '{"error":"Not found."}';
        }
      }
    }
{{- end }}
