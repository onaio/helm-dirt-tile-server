# Default values for dirt-tile-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: apiyo/dirt-simple-postgis-http-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 0.3.10

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

configs:
  tablecolumn: "geom"
  tablename: "logger_instance"
  serverport: "3000"
  serverlogger: "true"
  onadataurl: "https://api.ona.io"
  formsendpoint: "/api/v1/forms/"
  dataviewsendpoint: "/api/v1/dataviews/"
  mergeddatasetsendpoint: "/api/v1/merged-datasets/"
  # See README, "The database login".
  statementtimeout: "0"
  # onadata_domain: "https://<your-onadata-url>"
  # corsorigins: "https://<your-onadata-url>,https://<another>"

pgConnections:
  - secretName: db1
    secretValue: "test-db-url"

# We are going to get this from a helm secret
# Example:
# -secretName: db1
#  secretValue: "postgres://onadatauser:onadatapass@<your ip>:5432/onadata"

# Set this to true if you want to use an existing secret.
# If you do, make sure to set the secret name `pgConnections[i].secretName` config.
pgconnectionUseExistingSecret: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

containerPort: 3000

affinity: {}
livenessProbe:
  httpGet:
    path: /health-check
    port: http
  initialDelaySeconds: 15
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 2
readinessProbe:
  httpGet:
    path: /health-check
    port: http
  initialDelaySeconds: 15
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 2

networkPolicy:
  enabled: false

# Optional nginx sidecar in front of the tile server. It asks whether the
# caller may read the dataset before every response, remembers the answer for
# a short time, and caches the responses themselves. When enabled, the Service
# sends traffic to the sidecar instead of the tile server.
sidecar:
  enabled: false
  # Base URL asked whether a caller may read a dataset (no trailing slash).
  # Defaults to configs.onadataurl. Set it to reach the same service by a
  # shorter route, such as its in-cluster address.
  onadataUrl: ""
  # Host header and TLS server name sent to onadataUrl. Derived from it when
  # empty. Set it when the address differs from the name on the certificate.
  onadataHost: ""
  port: 8080
  # Seconds an approval is remembered. A change of access takes this long to
  # show. 0 asks every time.
  permissionTtlSeconds: 60
  # Seconds a refusal is remembered.
  refusalTtlSeconds: 10
  # Seconds to wait for the tile server to answer.
  readTimeoutSeconds: 60
  # Seconds to wait for the service that grants permission. Every request
  # waits for it, so these are short.
  permissionConnectTimeoutSeconds: 3
  permissionReadTimeoutSeconds: 5
  # Certificates the service that grants permission is checked against.
  trustedCertificates: /etc/ssl/certs/ca-certificates.crt
  # Connections one worker may hold. Each request in flight uses up to three.
  workerConnections: 4096
  # DNS server used to resolve onadataUrl at request time. It knows no search
  # domains, so onadataUrl must name its host in full.
  resolver: "kube-dns.kube-system.svc.cluster.local"
  resolverValid: "30s"
  # Responses are cached per dataset and not per caller, and permission is
  # still asked before every cached response. Add nocache=<anything> to a
  # request to fetch it afresh and replace what is cached.
  responseCache:
    enabled: true
    # Shared memory for cache keys, in megabytes.
    keysZoneMb: 50
    # Most disk the cached responses may take. The volume they are held on
    # is given room for this and the permission cache beside it.
    maxSize: "1g"
    volumeSize: "2Gi"
    # A response nobody has asked for in this long is dropped.
    inactive: "24h"
    # Seconds a response is served before it is fetched again. Changes to the
    # data take this long to show.
    ttlSeconds: 10800
  image:
    repository: nginx
    # A patch release of the stable line, named in full so that every pod
    # runs the same one.
    tag: "1.30.5-alpine"
    pullPolicy: IfNotPresent
  # The configuration keeps nginx's own files under /tmp and its port above
  # 1024, so it needs none of what it is refused here.
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # Requests are set because an autoscaler measuring CPU use needs them on
  # every container of the pod.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
